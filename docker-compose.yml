services:
  tww-seo-agent:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Cloudflare Tunnel: gives this server a public HTTPS hostname without
  # opening any inbound port on this box. This matters because your Oracle
  # boxes already have 80/443 bound by whatever serves your FlyWP sites — a
  # reverse proxy that also grabs those ports (Caddy, Nginx) would conflict
  # with that. The tunnel makes only an outbound connection to Cloudflare, so
  # it runs safely alongside your existing sites on the same box.
  # See README.md "Deploy" for how to create the tunnel and get a token.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - tww-seo-agent
